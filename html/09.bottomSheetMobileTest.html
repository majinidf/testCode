<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body {
  margin: 0; padding: 0;
}

.l-wrapper {
  height: 2000px;
}

.container {
  box-sizing: border-box;
  position: fixed;
  left: 0;
  right: 0;
  top: 60px;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 60px);
  height: calc(100dvh - 60px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: skyblue;
}
  
.bottom {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 50px;
  margin: auto 0 0;
  background: pink;
}
</style>
</head>
<body>
  <div class="l-wrapper">
    <div class="container">
      container
      <div class="bottom">bottom</div>
    </div>
  </div>
</body>
</html>
